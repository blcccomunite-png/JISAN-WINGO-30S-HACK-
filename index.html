    <div id="lockScreen">
      <svg viewBox="0 0 24 24" width="30" height="30" stroke="var(--gold1)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(255,190,0,.6)); margin-bottom: -2px;">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <input type="password" id="passInput" placeholder="Password" autocomplete="off">
      <button id="unlockBtn">UNLOCK</button>
      <div id="lockMsg"></div>
    </div>

    <!-- Prediction Section -->
    <div class="row">
      <div class="wrapS"><div class="oct side s off" id="sideS"><div class="oct sin">
        <svg class="cr" viewBox="0 0 60 40"><path d="M4 34 L8 10 L20 22 L30 4 L40 22 L52 10 L56 34 Z" fill="#7fe0ff"></path></svg>
        <span class="big-t">SMALL</span><span class="rng">0 - 4</span>
        <div class="pill" id="pillS"><u>✖</u><span>NOT PREDICTED</span></div>
      </div></div></div>

      <div class="wrapC"><div class="oct cen"><div class="oct cin" id="cin">
        <span class="lab" id="periodDisplay">LIVE NUMBER</span>
        <div class="dial">
          <svg class="ring1" viewBox="0 0 60 60"><circle cx="30" cy="30" r="27" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"></circle><circle id="pg" cx="30" cy="30" r="27" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="169.64600329384882" stroke-dashoffset="137.17010339662968"></circle></svg>
          <svg class="spin" viewBox="0 0 60 60"><circle cx="30" cy="30" r="21" fill="none" stroke="#27ffc2" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="10 8"></circle></svg>
          <div class="dnum" id="dnum">-</div>
        </div>
        <div class="next"><small>NEXT IN</small><b><svg viewBox="0 0 20 20" fill="none" stroke="#ffd34d" stroke-width="2"><circle cx="10" cy="10" r="8"></circle><path d="M10 5v5l3 2"></path></svg><span id="sec">6s</span></b></div>
      </div></div></div>

      <div class="wrapB"><div class="oct side b off" id="sideB"><div class="oct sin">
        <svg class="cr" viewBox="0 0 60 40"><path d="M4 34 L8 10 L20 22 L30 4 L40 22 L52 10 L56 34 Z" fill="#ff9ab4"></path></svg>
        <span class="big-t">BIG</span><span class="rng">5 - 9</span>
        <div class="pill" id="pillB"><u>✖</u><span>NOT PREDICTED</span></div>
      </div></div></div>
    </div>

    <!-- Recent Section -->
    <div class="recent">
      <div class="rh"><svg viewBox="0 0 20 20" fill="none" stroke="#2fb8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17h16M4 13l4-4 3 3 5-6"></path></svg>RECENT RESULTS</div>
      <div class="rb" id="rb"></div>
    </div>
  </div>
</aside>

<script>
(function(){
'use strict';

// ===== Config =====
var PASS = 'JISAN30S';
var API_BASE = 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json';
var CACHE_KEY = 'blcc_hist_v3';
var POS_KEY = 'blcc_pos_v3';

// ===== DOM =====
function $(id){return document.getElementById(id);}
var panel=$('cod'), lockScreen=$('lockScreen'), passInput=$('passInput'), unlockBtn=$('unlockBtn'), lockMsg=$('lockMsg');
var dnum=$('dnum'), secEl=$('sec'), pg=$('pg'), bpg=$('bpg'), cin=$('cin'), periodDisplay=$('periodDisplay');
var sideS=$('sideS'), sideB=$('sideB'), pillS=$('pillS'), pillB=$('pillB'), rb=$('rb'), dot=$('dot');
var minBtn=$('minBtn'), bub=$('bub'), fx=$('fx'), ctx=fx.getContext('2d');

// ===== State =====
var history={};
var lastIssue=null;
var predicted=null;
var locked=true;
var lastFetch=0;
var fetching=false;
var isMini=false;

// ===== Storage =====
function loadJSON(key,def){
  try{var v=JSON.parse(localStorage.getItem(key));return v&&typeof v==='object'?v:def;}catch(e){return def;}
}
function saveJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}

history=loadJSON(CACHE_KEY,{});

// ===== Lock screen =====
function showLock(){
  locked=true;
  lockScreen.classList.remove('hidden');
  passInput.value='';
  lockMsg.textContent='';
  setTimeout(function(){passInput.focus();},80);
}
function hideLock(){
  locked=false;
  lockScreen.classList.add('hidden');
}
function checkPass(){
  var v=passInput.value.trim();
  if(v===PASS){
    hideLock();
  }else{
    lockMsg.textContent='Wrong password!';
    passInput.value='';
    passInput.focus();
  }
}
unlockBtn.addEventListener('click',checkPass);
passInput.addEventListener('keydown',function(e){if(e.key==='Enter')checkPass();});

// ===== Fetch history =====
async function fetchHistory(){
  if(fetching) return false;
  fetching=true;
  try{
    var url=API_BASE+'?ts='+Date.now();
    var res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('bad response');
    var data=await res.json();
    var list=null;
    if(Array.isArray(data)) list=data;
    else if(data && Array.isArray(data.data)) list=data.data;
    else if(data && data.data && Array.isArray(data.data.list)) list=data.data.list;
    else if(data && Array.isArray(data.list)) list=data.list;

    if(list && list.length){
      list.forEach(function(item){
        var issue = item.issueNumber || item.issue || item.period || item.qs;
        var num = parseInt(item.number != null ? item.number : item.num, 10);
        if(issue && !isNaN(num) && num>=0 && num<=9){
          history[String(issue)] = num;
        }
      });
      saveJSON(CACHE_KEY,history);
      dot.classList.remove('off');
      fetching=false;
      return true;
    }
  }catch(e){
    dot.classList.add('off');
  }
  fetching=false;
  return false;
}

// ===== Prediction =====
function getSortedIssues(){
  return Object.keys(history).sort(function(a,b){
    try{return BigInt(a)>BigInt(b)?1:(BigInt(a)<BigInt(b)?-1:0);}catch(e){return a>b?1:-1;}
  });
}

function generatePrediction(){
  var issues=getSortedIssues();
  if(issues.length<3) return null;
  var recent=issues.slice(-5);
  var seq=recent.map(function(iss){return history[iss];});

  var last3=seq.slice(-3);
  var big3=last3.filter(function(n){return n>=5;}).length;
  var small3=last3.length-big3;

  var size;
  if(big3===3) size='small';
  else if(small3===3) size='big';
  else {
    var big5=seq.filter(function(n){return n>=5;}).length;
    var small5=seq.length-big5;
    size=big5>=small5?'big':'small';
  }

  var freq={};
  seq.forEach(function(n){freq[n]=(freq[n]||0)+1;});
  var candidates=seq.filter(function(n){
    return (size==='big'&&n>=5)||(size==='small'&&n<=4);
  });
  var bestNum = size==='big'?5:0;
  var bestCount = 0;
  candidates.forEach(function(n){
    var c=freq[n]||0;
    if(c>bestCount){bestCount=c;bestNum=n;}
  });

  return {
    num: bestNum,
    size: size,
    basedOn: seq.length,
    bigCount: seq.filter(function(n){return n>=5;}).length,
    smallCount: seq.filter(function(n){return n<5;}).length
  };
}

// ===== UI =====
function updateRecent(){
  rb.innerHTML='';
  var issues=getSortedIssues().slice(-10).reverse();
  issues.forEach(function(iss){
    var n=history[iss];
    var span=document.createElement('span');
    span.className='c'+n;
    span.textContent=n;
    rb.appendChild(span);
  });
}

function setPredictionUI(){
  if(!predicted){
    sideS.classList.add('off');
    sideB.classList.add('off');
    sideS.classList.remove('on');
    sideB.classList.remove('on');
    pillS.querySelector('u').textContent='✖';
    pillS.querySelector('span').textContent='NOT PREDICTED';
    pillB.querySelector('u').textContent='✖';
    pillB.querySelector('span').textContent='NOT PREDICTED';
    return;
  }
  var isSmall=predicted.size==='small';
  sideS.classList.toggle('on',isSmall);
  sideB.classList.toggle('on',!isSmall);
  sideS.classList.toggle('off',!isSmall);
  sideB.classList.toggle('off',isSmall);
  pillS.querySelector('u').textContent=isSmall?'✔':'✖';
  pillS.querySelector('span').textContent=isSmall?'PREDICTED':'NOT PREDICTED';
  pillB.querySelector('u').textContent=!isSmall?'✔':'✖';
  pillB.querySelector('span').textContent=!isSmall?'PREDICTED':'NOT PREDICTED';

  var col=isSmall?'#27ffc2':'#ff5a86';
  cin.style.setProperty('--c',col);
  dnum.style.color=col;
  dnum.style.textShadow='0 0 12px '+col;
}

function showResultFx(win){
  panel.classList.remove('hit','miss');
  void panel.offsetWidth;
  panel.classList.add(win?'hit':'miss');
  if(navigator.vibrate) navigator.vibrate(win?[60,40,60]:40);
}

// ===== Main loop =====
async function tick(){
  var now=Date.now();
  if(now-lastFetch>4000){
    lastFetch=now;
    await fetchHistory();
    updateRecent();
    predicted=generatePrediction();
    setPredictionUI();

    var issues=getSortedIssues();
    if(issues.length){
      var latest=issues[issues.length-1];
      if(latest!==lastIssue){
        if(lastIssue!==null && predicted){
          var actualNum=history[latest];
          if(actualNum!==undefined){
            var actualSize=actualNum>=5?'big':'small';
            var win=predicted.size===actualSize;
            showResultFx(win);
          }
        }
        lastIssue=latest;
        periodDisplay.textContent='ISSUE '+String(latest).slice(-6);
        dnum.textContent=history[latest];
        dnum.classList.remove('settle');
        void dnum.offsetWidth;
        dnum.classList.add('settle');
      }
    }
  }

  var d=new Date();
  var seconds=d.getSeconds();
  var ms=d.getMilliseconds();
  var remaining=30-seconds - ms/1000;
  if(remaining<0) remaining+=30;
  secEl.textContent=Math.ceil(remaining)+'s';

  var pct=1-remaining/30;
  var dash=2*Math.PI*27;
  pg.setAttribute('stroke-dashoffset',dash*(1-pct));
  var dashB=2*Math.PI*23;
  bpg.setAttribute('stroke-dashoffset',dashB*(1-pct));

  cin.classList.toggle('urgent',remaining<=5);
  requestAnimationFrame(tick);
}

// ===== Drag =====
var drag=null;
function setPos(x,y){
  var w=panel.offsetWidth, h=panel.offsetHeight;
  var maxX=window.innerWidth-w-8, maxY=window.innerHeight-h-8;
  x=Math.max(8,Math.min(maxX,x));
  y=Math.max(8,Math.min(maxY,y));
  panel.style.left=x+'px';
  panel.style.top=y+'px';
  saveJSON(POS_KEY,{x:x,y:y});
}
panel.addEventListener('pointerdown',function(e){
  if(e.target.closest('button')||e.target.closest('input')) return;
  drag={sx:e.clientX,sy:e.clientY,ox:panel.offsetLeft,oy:panel.offsetTop,moved:false};
  panel.setPointerCapture(e.pointerId);
});
panel.addEventListener('pointermove',function(e){
  if(!drag) return;
  var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(Math.abs(dx)>4||Math.abs(dy)>4) drag.moved=true;
  if(drag.moved) setPos(drag.ox+dx,drag.oy+dy);
});
panel.addEventListener('pointerup',function(){
  if(drag&&!drag.moved) saveJSON(POS_KEY,{x:panel.offsetLeft,y:panel.offsetTop});
  drag=null;
});

// ===== Minimize / Restore =====
function minimize(){
  if(isMini) return;
  isMini=true;
  panel.classList.add('mini');
  minBtn.textContent='HIDE';
  minBtn.setAttribute('aria-label','Hide panel');
  saveJSON(POS_KEY,{x:panel.offsetLeft,y:panel.offsetTop,mini:true});
}
function restore(){
  if(!isMini) return;
  isMini=false;
  panel.classList.remove('mini');
  minBtn.textContent='HIDE';
  minBtn.setAttribute('aria-label','Hide panel');
  var p=loadJSON(POS_KEY,{x:window.innerWidth-280,y:80});
  setPos(p.x,p.y);
  saveJSON(POS_KEY,{x:panel.offsetLeft,y:panel.offsetTop,mini:false});
}
minBtn.addEventListener('click',function(e){
  e.stopPropagation();
  if(isMini) restore(); else minimize();
});
bub.addEventListener('click',function(e){
  e.stopPropagation();
  if(isMini) restore();
});

// ===== Init =====
(function init(){
  var saved=loadJSON(POS_KEY,{x:window.innerWidth-280,y:80,mini:false});
  if(saved.mini){
    isMini=true;
    panel.classList.add('mini');
  }else{
    setPos(saved.x,saved.y);
  }
  document.title='BLCC TEAM JISAN 30S PREDICTOR';
  showLock();

  fetchHistory().then(function(){
    updateRecent();
    predicted=generatePrediction();
    setPredictionUI();
    var issues=getSortedIssues();
    if(issues.length){
      lastIssue=issues[issues.length-1];
      periodDisplay.textContent='ISSUE '+String(lastIssue).slice(-6);
      dnum.textContent=history[lastIssue];
    }else{
      var demo={};
      var base=Date.now();
      for(var i=0;i<20;i++){
        var issue=String(base-i*30000);
        demo[issue]=Math.floor(Math.random()*10);
      }
      history=demo;
      updateRecent();
      predicted=generatePrediction();
      setPredictionUI();
      var iss=getSortedIssues();
      lastIssue=iss[iss.length-1];
      periodDisplay.textContent='ISSUE '+String(lastIssue).slice(-6);
      dnum.textContent=history[lastIssue];
    }
  });

  requestAnimationFrame(tick);
})();

})();
</script>
</body>
</html>
